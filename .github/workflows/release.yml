name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v2.0.0"
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Publish the jar"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Check the tag matches mod_version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match mod_version $version in gradle.properties"
            exit 1
          fi
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          previous=$(gh release list --repo "$REPO" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          since="1970-01-01T00:00:00Z"
          if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then
            since=$(gh release view "$previous" --repo "$REPO" --json publishedAt --jq .publishedAt)
          fi

          filter=$(cat <<'FILTER'
          def line: "- \(.title) (@\(.author.login) - #\(.number))";
          def labelled($names): any(.labels[].name; . as $l | $names | index($l));
          map(select(.mergedAt >= "__SINCE__")) as $prs
          | {
              features: [$prs[] | select(labelled(["feature", "enhancement"])) | line],
              improvements: [$prs[] | select(labelled(["improvement"])) | line],
              fixes: [$prs[] | select(labelled(["bug"])) | line],
              other: [$prs[] | select(labelled(["feature", "enhancement", "improvement", "bug"]) | not) | line]
            }
          | "This release requires Fabric Language Kotlin 1.14.0 or newer.",
            (if (.features | length) > 0 then (["", "## New Features"] + .features) | join("\n") else empty end),
            (if (.improvements | length) > 0 then (["", "## Improvements"] + .improvements) | join("\n") else empty end),
            (if (.fixes | length) > 0 then (["", "## Bug Fixes"] + .fixes) | join("\n") else empty end),
            (if (.other | length) > 0 then (["", "## Changes"] + .other) | join("\n") else empty end)
          FILTER
          )
          filter=${filter//__SINCE__/$since}

          gh pr list --repo "$REPO" --state merged --limit 200 \
            --json number,title,author,labels,mergedAt --jq "$filter" > release-notes.md
          cat release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          jar=$(find build/libs -maxdepth 1 -name 'ratons-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error::no jar was built"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$jar" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$jar" --title "$TAG" --notes-file release-notes.md
          fi

  badges:
    needs: release
    runs-on: ubuntu-latest
    name: "Refresh the badges"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update the download and version badges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          downloads=$(gh api "repos/$REPO/releases" --paginate --jq '[.[].assets[].download_count] | add // 0')
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          sed -i -E "s|badge/Downloads-[0-9]+-green|badge/Downloads-$downloads-green|" README.md
          sed -i -E "s|badge/Version-v[0-9.]+-blue|badge/Version-v$version-blue|" README.md
          if git diff --quiet README.md; then
            echo "Badges already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh the download and version badges"
          git push origin main
