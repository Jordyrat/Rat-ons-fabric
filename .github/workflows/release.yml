name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Publish the jar"
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Check the tag matches mod_version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match mod_version $version in gradle.properties"
            exit 1
          fi
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          jar=$(find build/libs -maxdepth 1 -name 'ratons-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error::no jar was built"
            exit 1
          fi
          gh release create "$TAG" "$jar" --title "$TAG" --generate-notes --clobber
